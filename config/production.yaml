tool: google_flow
aspect_ratio: "9:16"
video:
  resolution: 360p
  default_duration_s: 8
  duration_credits:
    6: 5
    8: 6
    10: 7
  max_attempts: 2
image:
  credits: 0
accounts:
  count: 5
  daily_credits_per_account: 50
  reserve_videos_per_account: 1
workflow:
  mode: images_first
audio:
  mode: native
  external_files: false
pacing:
  words_per_second: 2.5
  min_speech_fill: 0.6
  max_silence_s: 1.5
  max_dialogue_lines: 2
  max_words_per_line: 15
  max_intentional_silences_per_episode: 1
